[project]
name = "terminator-game"
version = "0.1.0"
description = "Interactive multiplayer game with LangGraph AI agents and Drasi continuous queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "langchain-drasi",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv.sources]
langchain-drasi = { path = "../..", editable = true }
