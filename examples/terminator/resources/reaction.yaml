kind: Reaction
apiVersion: v1
name: test-mcp
spec:
  kind: MCP
  queries:
    idle-players: |
      description: "Position alert for players who have been idle for more than 5 seconds"
      added:
        template: |
          {
            "description": "Player {{after.id}} was idle at position ({{after.x}}, {{after.y}})"
          }
    fast-players: |
      description: "Position alert for players who have been fast for more than 1 second"
      added:
        template: |
          {
            "description": "Player {{after.id}} was fast at position ({{after.x}}, {{after.y}})"
          }
      deleted:
        template: |
          {
            "description": "Player {{before.id}} is no longer at position ({{before.x}}, {{before.y}})"
          }
---
