apiVersion: v1
kind: ConfigMap
metadata:
  name: game-data-init
data:
  init.sql: |
    DROP TABLE IF EXISTS public.player;

    CREATE TABLE IF NOT EXISTS public.player
    (
        id character varying(20) COLLATE pg_catalog."default" NOT NULL,
        x integer NOT NULL,
        y integer NOT NULL,
        type character varying(10) NOT NULL DEFAULT 'human',
        CONSTRAINT player_pkey PRIMARY KEY (id),
        CONSTRAINT player_type_check CHECK (type IN ('human', 'ai'))
    );

    CREATE INDEX IF NOT EXISTS idx_player_position ON public.player(x, y);
    CREATE INDEX IF NOT EXISTS idx_player_type ON public.player(type);

    ALTER TABLE public.player OWNER TO postgres;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-pg-config
  labels:
    app: postgres
data:
  POSTGRES_DB: game
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          args: ["-c", "wal_level=logical"]
          volumeMounts:
          - name: init
            mountPath: "/docker-entrypoint-initdb.d"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: game-pg-config
      volumes:
        - name: init
          configMap:
            name: game-data-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
   - port: 5432
  selector:
   app: postgres
